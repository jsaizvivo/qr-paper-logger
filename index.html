<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/>
<title>QR Paper Logger</title>
<link rel="manifest" href="manifest.json"/>
<link rel="stylesheet" href="styles.css"/>
<link rel="apple-touch-icon" href="apple-touch-icon.png"/>
<meta name="theme-color" content="#001f5b"/>
</head>
<body>

<!-- Operator gate -->
<div id="opGate" style="position:fixed;inset:0;background:#001f5b;color:#fff;display:flex;flex-direction:column;justify-content:center;align-items:center;z-index:100;padding:20px">
  <h2>QR Paper Logger</h2>
  <p>Enter operator name to start the session</p>
  <input id="opName" placeholder="e.g. J. Saiz" style="max-width:300px;color:#000"/>
  <button id="opStart" style="margin-top:12px;max-width:300px">Start session</button>
  <p id="opHint" style="font-size:12px;opacity:.7;margin-top:16px"></p>
</div>

<nav id="tabs">
  <button data-tab="capture" class="active">Capture</button>
  <button data-tab="gallery">Gallery</button>
  <button data-tab="progress">Progress</button>
</nav>

<section id="tab-capture" class="tab active">
  <h2>Capture <small id="opLabel" style="font-weight:400;font-size:13px;opacity:.7"></small></h2>

  <div class="mode-row">
    <label><input type="radio" name="mode" value="live" checked/> Live camera (auto QR scan)</label>
    <label><input type="radio" name="mode" value="native"/> Native camera app</label>
  </div>

  <div id="liveBox">
    <video id="video" autoplay playsinline muted></video>
    <canvas id="canvas"></canvas>
    <div class="row">
      <button id="startBtn">Start camera</button>
      <button id="snapBtn" disabled>Capture frame</button>
      <button id="torchBtn" disabled>Torch</button>
    </div>
  </div>

  <div id="nativeBox" hidden>
    <p>Opens your phone's camera. Make sure your default is a <b>camera app</b> (not a scanner that returns PDFs).</p>
    <input id="nativeInput" type="file" accept="image/*" capture="environment"/>
    <img id="nativePreview" alt=""/>
  </div>

  <p>QR detected: <span id="qrText">(none)</span>
     <button id="manualQrBtn" type="button">Enter manually</button></p>

  <div id="formArea">
    <label>Phone type</label>
    <select id="phone"><option>iPhone</option><option>Android</option><option>Other</option></select>

    <label>Scan app</label>
    <select id="scanApp"><option>Native camera</option><option>Scanner app</option></select>

    <label>Rotation severity</label>
    <select id="rotation_severity"><option>none</option><option>mild</option><option>strong</option></select>

    <label>Crease severity</label>
    <select id="crease_severity"><option>none</option><option>mild</option><option>strong</option></select>

    <label>Blur severity</label>
    <select id="blur_severity"><option>none</option><option>mild</option><option>strong</option></select>

    <fieldset style="border:1px solid #ddd;border-radius:6px;padding:8px;margin-top:10px">
      <legend>Augmentation conditions</legend>
      <label class="chk"><input type="checkbox" id="has_rotation"/> has_rotation</label>
      <label class="chk"><input type="checkbox" id="has_shear"/> has_shear</label>
      <label class="chk"><input type="checkbox" id="has_crease"/> has_crease</label>
      <label class="chk"><input type="checkbox" id="has_ink_annotation"/> has_ink_annotation</label>
      <label class="chk"><input type="checkbox" id="has_shadow"/> has_shadow</label>
      <label class="chk"><input type="checkbox" id="has_partial_occlusion"/> has_partial_occlusion</label>
      <label class="chk"><input type="checkbox" id="has_motion_blur"/> has_motion_blur</label>
    </fieldset>

    <label>Image format</label>
    <select id="format"><option selected>jpg</option><option>png</option></select>

    <label>Notes</label>
    <input id="notes" type="text"/>

    <button id="saveBtn" disabled>Save record</button>
  </div>

  <p id="status"></p>
</section>

<section id="tab-gallery" class="tab">
  <h2>Gallery</h2>
  <input id="filter" placeholder="Filter by QR ID..."/>
  <div id="grid"></div>
</section>

<section id="tab-progress" class="tab">
  <h2>Progress</h2>
  <div id="stats"></div>
  <h3>Achievements</h3>
  <div id="badges"></div>
  <h3>Per-ID breakdown</h3>
  <table id="idTable"><thead><tr><th>QR ID</th><th>Photos</th></tr></thead><tbody></tbody></table>
  <hr/>
  <div class="row">
    <button id="importBtn">Import .xlsx</button>
    <input id="importFile" type="file" accept=".xlsx" hidden/>
    <button id="exportBtn">Export .xlsx + images (ZIP)</button>
    <button id="wipeBtn" class="danger">Wipe local data</button>
  </div>
  <p style="font-size:12px;opacity:.7">Operator: <span id="opLabel2"></span> &middot; <a href="#" id="changeOp">change</a></p>
</section>

<script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js"></script>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"></script>
<script src="app.js"></script>
<script>if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js');</script>
</body>
</html>
