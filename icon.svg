<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Background -->
  <rect width="512" height="512" rx="96" fill="#001f5b"/>

  <!-- QR-style corner markers -->
  <g fill="#ffffff">
    <!-- top-left -->
    <rect x="80"  y="80"  width="110" height="110" rx="14"/>
    <!-- top-right -->
    <rect x="322" y="80"  width="110" height="110" rx="14"/>
    <!-- bottom-left -->
    <rect x="80"  y="322" width="110" height="110" rx="14"/>
  </g>
  <g fill="#001f5b">
    <rect x="108" y="108" width="54" height="54" rx="6"/>
    <rect x="350" y="108" width="54" height="54" rx="6"/>
    <rect x="108" y="350" width="54" height="54" rx="6"/>
  </g>

  <!-- Data dots -->
  <g fill="#ffffff">
    <rect x="220" y="90"  width="24" height="24"/>
    <rect x="260" y="130" width="24" height="24"/>
    <rect x="220" y="170" width="24" height="24"/>
    <rect x="90"  y="220" width="24" height="24"/>
    <rect x="130" y="260" width="24" height="24"/>
    <rect x="170" y="220" width="24" height="24"/>
    <rect x="260" y="260" width="24" height="24"/>
    <rect x="300" y="220" width="24" height="24"/>
    <rect x="220" y="300" width="24" height="24"/>
    <rect x="260" y="340" width="24" height="24"/>
    <rect x="340" y="260" width="24" height="24"/>
    <rect x="380" y="300" width="24" height="24"/>
    <rect x="340" y="340" width="24" height="24"/>
    <rect x="300" y="380" width="24" height="24"/>
    <rect x="380" y="380" width="24" height="24"/>
    <rect x="220" y="380" width="24" height="24"/>
  </g>

  <!-- Camera lens accent -->
  <circle cx="376" cy="376" r="40" fill="#ffd34d" stroke="#001f5b" stroke-width="6"/>
  <circle cx="376" cy="376" r="18" fill="#001f5b"/>
</svg>
